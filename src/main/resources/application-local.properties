# ============================================================================
#  Profile local — dipakai `./mvnw test` dan `./mvnw spring-boot:run`.
#  Diaktifkan di pom.xml, bukan lewat @ActiveProfiles di kelas test.
#
#  Nilai dibaca dari .env di mesin pengembang, dan dari blok env: job pada
#  ci.yml saat test berjalan di GitHub Actions. Nama variabelnya sama persis
#  dengan yang dibaca profile dev dan prod — yang membedakan hanya sumber
#  nilainya.
#
#  Kredensial wajib tanpa nilai default: lebih baik gagal start daripada
#  diam-diam menyambung ke tempat yang salah. Yang bukan kredensial boleh
#  punya default yang masuk akal untuk mesin pengembang.
# ============================================================================

server.port=${APP_SERVER_PORT}

# ===== Database =====
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.schema=${DB_SCHEMA}
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA}

# ===== Redis =====
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.username=${REDIS_USERNAME}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.database=0
spring.data.redis.timeout=5s
spring.data.redis.connect-timeout=5s

app.redis.host=${REDIS_HOST}
app.redis.port=${REDIS_PORT}
app.redis.username=${REDIS_USERNAME}
app.redis.password=${REDIS_PASSWORD}
app.redis.timeout=10000ms
# Prefix wajib berbeda dari container dev dan prod yang memakai Redis yang
# sama, supaya test tidak menimpa cache aplikasi yang sedang melayani.
app.redis.key-prefix=${APP_REDIS_KEY_PREFIX}
app.redis.lettuce-pool-max-active=100
app.redis.lettuce-pool-max-wait=-1ms
app.redis.lettuce-pool-max-idle=50
app.redis.lettuce-pool-min-idle=10

# ===== Auth & enkripsi =====
app.security.jwt-secret=${JWT_SECRET}
app.security.password=${DEMO_PASSWORD}
app.security.crypto-key=${CRYPTO_KEY}
app.security.cors-allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# ===== Integrasi & penyimpanan =====
app.dummy-json.base-url=${DUMMYJSON_BASE_URL:https://dummyjson.com}
app.dummy-json.connect-timeout=5s
app.dummy-json.read-timeout=10s
app.image.base-dir=${APP_IMAGE_BASE_DIR:./resources/images}

# ===== Logging =====
logging.level.com.masesas.exercises.demo1=DEBUG
logging.level.org.springframework.security=INFO
