# ============================================================================
#  Profile dev — dipakai container demo1-dev.
#
#  Nilai dibaca dari environment yang disuntikkan Docker lewat .env.app.
#  Suffix _DEV sudah dilucuti scripts/render-env.sh saat berkas itu disusun,
#  sehingga nama di sini sama dengan yang dibaca profile lain — yang berbeda
#  hanya sumber nilainya.
#
#  Seluruh nilai wajib tanpa default. Container yang kehilangan satu variabel
#  harus gagal start, bukan hidup dengan nilai bawaan yang salah.
# ============================================================================

server.port=${APP_SERVER_PORT}

# ===== Database =====
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.schema=${DB_SCHEMA}
# Dev cuma dipakai beberapa orang, dan dev serta prod menekan PostgreSQL yang
# sama, jadi angkanya sengaja tidak besar.
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA}

# ===== Redis =====
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.username=${REDIS_USERNAME}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.database=0
spring.data.redis.timeout=5s
spring.data.redis.connect-timeout=5s

app.redis.host=${REDIS_HOST}
app.redis.port=${REDIS_PORT}
app.redis.username=${REDIS_USERNAME}
app.redis.password=${REDIS_PASSWORD}
app.redis.timeout=10000ms
# Dev dan prod berbagi satu instance Redis. Prefix yang berbeda adalah
# satu-satunya hal yang mencegah cache keduanya saling menimpa.
app.redis.key-prefix=${APP_REDIS_KEY_PREFIX}
app.redis.lettuce-pool-max-active=100
app.redis.lettuce-pool-max-wait=-1ms
app.redis.lettuce-pool-max-idle=50
app.redis.lettuce-pool-min-idle=10

# ===== Auth & enkripsi =====
app.security.jwt-secret=${JWT_SECRET}
app.security.password=${DEMO_PASSWORD}
app.security.crypto-key=${CRYPTO_KEY}
app.security.cors-allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

# ===== Integrasi & penyimpanan =====
app.dummy-json.base-url=${DUMMYJSON_BASE_URL}
app.dummy-json.connect-timeout=5s
app.dummy-json.read-timeout=10s
# Menunjuk direktori yang di-mount sebagai volume. Tanpa volume, avatar yang
# diunggah hilang setiap container diganti.
app.image.base-dir=${APP_IMAGE_BASE_DIR}

# ===== Logging =====
logging.level.com.masesas.exercises.demo1=DEBUG
logging.level.org.springframework.security=INFO
