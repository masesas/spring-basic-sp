spring.application.name=demo1

# Kredensial dibaca dari .env yang tidak ikut di-commit. Salin .env.example
# jadi .env sebelum menjalankan aplikasi. Tanpa .env, aplikasi gagal start
# dengan pesan placeholder tidak bisa di-resolve — sengaja, supaya tidak ada
# nilai bawaan diam-diam yang lolos ke lingkungan nyata.
spring.config.import=optional:file:.env[.properties]

# ===== Database (PostgreSQL) =====
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# schema default untuk query lewat JdbcTemplate/SQL mentah
spring.datasource.hikari.schema=${DB_SCHEMA}

# ===== JPA / Hibernate =====
# none = Hibernate tidak mengubah struktur tabel; skema dikelola manual
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA}
# dimatikan: SQL yang tercetak memuat nilai kolom, termasuk data sensitif
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ===== Redis =====
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.username=${REDIS_USERNAME}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.database=0
spring.data.redis.timeout=5s
spring.data.redis.connect-timeout=5s

# ===== Auth (OWASP A07) =====
app.jwt.secret=${JWT_SECRET}
app.jwt.ttl-minutes=15
app.demo.password=${DEMO_PASSWORD}
app.rate-limit.per-minute=10

# ===== Enkripsi data sensitif (OWASP A02) =====
app.crypto.key=${CRYPTO_KEY}

# ===== Error response (OWASP A05) =====
# Klien tidak pernah menerima stacktrace, nama kelas, atau pesan exception
# internal — semuanya bahan bagus untuk menyusun serangan lanjutan.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# ===== CORS (OWASP A05) =====
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# ===== Logging (OWASP A09) =====
# correlationId disisipkan ke setiap baris supaya seluruh log satu request
# bisa ditelusuri sebagai satu rangkaian.
logging.pattern.level=%5p [%X{correlationId:-tanpa-id}]

# ===== Paging (dipakai endpoint GET /api/karyawan) =====
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.serialization-mode=via-dto
