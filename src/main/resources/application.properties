spring.application.name=demo1

# Kredensial dibaca dari .env yang tidak ikut di-commit. Salin .env.example
# jadi .env sebelum menjalankan aplikasi. Tanpa .env, aplikasi gagal start
# dengan pesan placeholder tidak bisa di-resolve — sengaja, supaya tidak ada
# nilai bawaan diam-diam yang lolos ke lingkungan nyata.
spring.config.import=optional:file:.env[.properties]

# ===== Database (PostgreSQL) =====
spring.datasource.url=${DB_URL:jdbc:postgresql://host:5432/nama_database}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# schema default untuk query lewat JdbcTemplate/SQL mentah
spring.datasource.hikari.schema=${DB_SCHEMA}

# ===== JPA / Hibernate =====
# none = Hibernate tidak mengubah struktur tabel; skema dikelola manual
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA}
# dimatikan: SQL yang tercetak memuat nilai kolom, termasuk data sensitif
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ===== Redis =====
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.username=${REDIS_USERNAME}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.database=0
spring.data.redis.timeout=5s
spring.data.redis.connect-timeout=5s

# ===== Auth =====
app.security.jwt-secret=${JWT_SECRET}
app.security.jwt-ttl-minutes=15
# Password bersama akun demo di database (lihat rbac_role_penuh_masesas.sql).
# Sejak RBAC Fase 3 nilai ini tidak lagi dipakai kode produksi mana pun — hanya
# dibaca test supaya kredensialnya tidak ditulis ulang di source.
app.security.password=${DEMO_PASSWORD}

# ===== Enkripsi data sensitif =====
app.security.crypto-key=${CRYPTO_KEY}

# ===== Error response =====
# Klien tidak pernah menerima stacktrace, nama kelas, atau pesan exception
# internal — semuanya bahan bagus untuk menyusun serangan lanjutan.
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never
spring.web.error.include-exception=false

# ===== CORS =====
app.security.cors-allowed-origins=http://localhost:3000,http://localhost:5173
app.redis.key-prefix=${REDIS_KEY_PREFIX:demo:${spring.profiles.active:dev}}
app.redis.host=${REDIS_HOST:redis.mnet.web.id}
app.redis.port=${REDIS_PORT:6379}
app.redis.timeout=${REDIS_TIMEOUT:10000ms}
app.redis.username=${REDIS_USERNAME:deployer}
app.redis.password=${REDIS_PASSWORD:}
app.redis.lettuce-pool-max-active=100
app.redis.lettuce-pool-max-wait=-1ms
app.redis.lettuce-pool-max-idle=50
app.redis.lettuce-pool-min-idle=10

# ===== Integrasi DummyJSON =====
# API publik tanpa kredensial; timeout wajib diisi supaya thread tidak
# menggantung selamanya kalau host tujuan tidak merespons.
app.dummy-json.base-url=${DUMMYJSON_BASE_URL:https://dummyjson.com}
app.dummy-json.connect-timeout=5s
app.dummy-json.read-timeout=10s

# ===== Penyimpanan gambar =====
# Berkas disimpan di luar classpath: direktori di dalam src/main/resources hanya
# ikut ter-copy saat build dan tidak bisa ditulis kalau aplikasi jalan sebagai jar.
# Hirarki akhir: <base-dir>/karyawan/<uuid>.<ext>
app.image.base-dir=${IMAGE_BASE_DIR:./resources/images}
app.image.max-size=2MB
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# ===== Logging =====
# correlationId disisipkan ke setiap baris supaya seluruh log satu request
# bisa ditelusuri sebagai satu rangkaian.
logging.pattern.level=%5p [%X{correlationId:-tanpa-id}]

# ===== Paging (dipakai endpoint GET /api/karyawan) =====
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.serialization-mode=via-dto


spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
