spring.application.name=demo1

# Berkas ini HANYA memuat konfigurasi yang tidak bergantung lingkungan:
# identitas aplikasi dan kebijakannya. Alamat, kredensial, ukuran sumber daya,
# dan tingkat log ada di application-<profile>.properties — satu berkas per
# lingkungan, supaya nilai yang berbeda bisa ditulis di tempatnya sendiri tanpa
# perlu membayangi nilai dari sini.
#
# Tidak ada skenario yang berjalan tanpa profile:
#   local -> ./mvnw test dan ./mvnw spring-boot:run  (diaktifkan di pom.xml)
#   dev   -> container demo1-dev
#   prod  -> container demo1-prod

# Kredensial pengembangan lokal dibaca dari .env yang tidak ikut di-commit.
# Salin .env.example jadi .env sebelum menjalankan aplikasi. Di dalam container
# berkas ini tidak ada dan `optional:` membuatnya dilewati diam-diam.
spring.config.import=optional:file:.env[.properties]

# Permintaan yang sedang berjalan diberi kesempatan selesai sebelum JVM mati.
# Tanpa ini, `docker compose up -d` memutus permintaan di tengah jalan.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# ===== Database =====
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
# none = Hibernate tidak mengubah struktur tabel; skema dikelola manual
spring.jpa.hibernate.ddl-auto=none
# dimatikan di semua lingkungan: SQL yang tercetak memuat nilai kolom,
# termasuk data sensitif
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ===== Auth =====
app.security.jwt-ttl-minutes=15

# ===== Error response =====
# Klien tidak pernah menerima stacktrace, nama kelas, atau pesan exception
# internal — semuanya bahan bagus untuk menyusun serangan lanjutan.
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never
spring.web.error.include-exception=false

# ===== Penyimpanan gambar =====
app.image.max-size=2MB
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# ===== Logging =====
# correlationId disisipkan ke setiap baris supaya seluruh log satu request
# bisa ditelusuri sebagai satu rangkaian.
logging.pattern.level=%5p [%X{correlationId:-tanpa-id}]

# ===== Paging (dipakai endpoint GET /api/karyawan) =====
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.serialization-mode=via-dto

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
