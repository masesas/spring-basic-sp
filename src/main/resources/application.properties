spring.application.name=demo1

# ===== Database (PostgreSQL) =====
spring.datasource.url=jdbc:postgresql://129.226.195.9:5432/binar_finance
spring.datasource.username=binar_admin
spring.datasource.password=binar_bc_password
spring.datasource.driver-class-name=org.postgresql.Driver
# schema default untuk query lewat JdbcTemplate/SQL mentah
spring.datasource.hikari.schema=masesas

# ===== JPA / Hibernate =====
# none = Hibernate tidak mengubah struktur tabel; skema dikelola manual
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.default_schema=masesas
# tampilkan SQL supaya efek cache kelihatan (query hilang saat data diambil dari Redis)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== Redis =====
spring.data.redis.host=129.226.195.9
spring.data.redis.port=6379
spring.data.redis.username=binar_app
spring.data.redis.password=binar_bc_password
spring.data.redis.database=0
spring.data.redis.timeout=5s
spring.data.redis.connect-timeout=5s

# ===== Auth (OWASP A07) =====
# Nilai-nilai di bawah akan dipindahkan ke .env pada Fase 3 (A05).
app.jwt.secret=ganti-secret-ini-minimal-32-karakter-untuk-hs256
app.jwt.ttl-minutes=15
app.demo.password=Password123!
app.rate-limit.per-minute=10
app.crypto.key=KDEt9GjNSnfzNA2l8OPJ4pcCVEL3ux5HwhNQ25pzMrc=

# ===== Paging (dipakai endpoint GET /api/karyawan) =====
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.serialization-mode=via-dto
